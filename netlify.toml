# Draft deployment. For launch, use npm run build and ELEVENTY_ENV=production.
[build]
  command = "npm run build:preview"
  publish = "dist"
  environment = { NODE_VERSION = "22", ELEVENTY_ENV = "preview" }

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-KoMeyGS98e+c9cByVhCFCrZEiSH+g0Ana8rhZjB+8uc='; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/book"
  to = "https://app.reclaim.ai/m/paul-paulb/chat"
  status = 302
  force = true

[[redirects]]
  from = "https://www.paulb.pro/*"
  to = "https://paulb.pro/:splat"
  status = 301
  force = true
